name: verify-and-search
on:
  push:
  workflow_dispatch:
    inputs:
      samples:
        description: Canonical-search sample budget per seed
        required: false
        default: "5000"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q pcf scripts tests
      - run: python -m unittest discover -s tests -v
  n5-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run deterministic n=5 campaign
        run: python -m scripts.campaign_n5 --samples ${{ github.event.inputs.samples || '5000' }} --seeds 4
      - name: Structured sparse n=5 layer (k=4)
        run: python -m scripts.search_sparse_n5 --k 4
      - uses: actions/upload-artifact@v4
        with:
          name: n5-campaign
          path: artifacts/n5_campaign/
